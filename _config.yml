theme: jekyll-theme-chirpy

url: "https://onlyoneway4ai.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai

title: One Way的博客
tagline: 学习 · 项目 · 生活
description: >-
  一万年太久，只争朝夕。

social:
  name: one way
  email: ""
  links:
    - https://github.com/onlyoneway4ai

github:
  username: onlyoneway4ai

avatar: /assets/img/avatar.jpg

theme_mode: # "" = system preference, "light", "dark"

toc: true

paginate: 10

permalink: /posts/:title/

# Chirpy requires Rouge's block formatter to preserve code whitespace
# when its HTML compression layout processes highlighted code.
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Disqus / Utterances / Giscus
comments:
  active: # empty = disabled
  disqus:
    shortname: ""
  utterances:
    repo: ""
    issue_term: ""
  giscus:
    repo: ""
    repo_id: ""
    category: ""
    category_id: ""
    mapping: ""
    strict: ""
    input_position: ""
    lang: zh-CN
    reactions_enabled: ""

google_analytics:
  id: ""

# ----- Collections: tabs -----
collections:
  tabs:
    output: true
    sort_by: order

# ----- Defaults -----
defaults:
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
      dynamic_title: true
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      math: true
      permalink: /posts/:title/
  - scope:
      path: assets/img/favicons
    values:
      swcache: true

# ----- Archives plugin -----
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

exclude:
  - README.md
  - vendor
  - tools
  - Gemfile
  - Gemfile.lock
  - .github
  - .jekyll-check
  - "_posts/note skill.md"
  - "**/.obsidian/**"
